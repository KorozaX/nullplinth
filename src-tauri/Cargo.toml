[package]
name = "nullplinth"
version = "0.1.0"
description = "NULLPLINTH - local-first security analysis workbench"
edition = "2021"
authors = ["NULLPLINTH"]

[lib]
name = "nullplinth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
csv = "1"
chrono = "0.4"
sha2 = "0.10"
ipnet = "2"
pcap-parser = "0.17"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"