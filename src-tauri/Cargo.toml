[package]
name = "nullplinth"
version = "0.3.0"
description = "NULLPLINTH - local-first security analysis workbench"
license = "MIT"
edition = "2021"
authors = ["NULLPLINTH"]

[lib]
name = "nullplinth_lib"
# rlib only: the cdylib/staticlib targets exist for Tauri mobile and overflow the
# MinGW export ordinal limit under the GNU toolchain. Desktop builds do not need them.
crate-type = ["rlib"]
# All Rust tests are integration tests under tests/. The lib unit-test harness is not
# used: cargo does not apply our Common-Controls manifest link args to it on the GNU
# toolchain, so it cannot load there. See docs/KNOWN_LIMITATIONS.md.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
csv = "1"
chrono = "0.4"
sha2 = "0.10"
ipnet = "2"
pcap-parser = "0.17"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
